[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pixi-companion"
version = "2.0.0"
description = "Desktop AI Companion & Study Buddy featuring retro pixel sprite animations, local SLM dialogue, 8 expressive emotional voice profiles, and hands-free two-way voice conversation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Devansh Baghel" }
]
keywords = [
    "ai-companion",
    "desktop-pet",
    "speech-recognition",
    "text-to-speech",
    "pixel-art",
    "pomodoro-timer",
    "qwen",
    "whisper"
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "requests>=2.28.0",
    "edge-tts>=7.0.0",
    "pyttsx3>=2.90",
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "PyAudio>=0.2.13",
    "psutil>=5.9.0",
]

[project.scripts]
pixi = "pixel_girl:main"

[tool.setuptools.packages.find]
where = ["."]
